<!DOCTYPE html>
<html>
<head><style>
  body { font: 13px Inter, sans-serif; margin: 16px; color: #111; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 12px; padding: 10px 14px; background: #4f46e5; color: #fff; border: 0; border-radius: 8px; cursor: pointer; width: 100%; }
  button.secondary { background: #e2e8f0; color: #111; margin-top: 8px; }
  #log { margin-top: 12px; font-size: 12px; color: #475569; white-space: pre-wrap; }
</style></head>
<body>
  <h3>Chai Mockup Importer</h3>
  <p>Paste a Chai plugin-spec URL or raw JSON spec.</p>
  <label>Spec URL</label>
  <input id="url" placeholder="http://localhost:4321/api/integrations/figma/plugin-spec?variantId=..." />
  <button id="importUrl">Import from URL</button>
  <label>Or paste JSON spec</label>
  <textarea id="json" rows="8" placeholder='{"title":"...","frames":[...]}'></textarea>
  <button id="importJson">Import JSON</button>
  <button class="secondary" id="close">Close</button>
  <div id="log"></div>
  <script>
    const log = (m) => { document.getElementById('log').textContent = m; };
    document.getElementById('importUrl').onclick = () => {
      const url = document.getElementById('url').value.trim();
      if (!url) return log('Enter a URL');
      parent.postMessage({ pluginMessage: { type: 'import-from-url', url } }, '*');
    };
    document.getElementById('importJson').onclick = () => {
      try {
        const spec = JSON.parse(document.getElementById('json').value);
        parent.postMessage({ pluginMessage: { type: 'import-spec', spec } }, '*');
      } catch (e) { log('Invalid JSON: ' + e.message); }
    };
    document.getElementById('close').onclick = () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    onmessage = (e) => {
      const msg = e.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'done') log('Created ' + msg.count + ' frames.');
      if (msg.type === 'error') log('Error: ' + msg.message);
    };
  </script>
</body>
</html>
